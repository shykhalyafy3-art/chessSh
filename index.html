<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الشطرنج - بوسعود</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            color: #fff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #menu-container, .sub-menu {
            text-align: center;
            background: rgba(20, 20, 35, 0.95);
            padding: 35px;
            border-radius: 20px;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            max-width: 400px;
            width: 90%;
        }

        .sub-menu { display: none; }

        h1 {
            color: #00ffcc;
            font-size: 28px;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.7);
        }

        .menu-btn {
            background: linear-gradient(45deg, #00ffcc, #00b386);
            color: #111;
            border: none;
            padding: 14px 20px;
            margin: 10px 0;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .menu-btn:hover { transform: scale(1.03); background: #00cc99; }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #00ffcc;
            background: #111;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }

        #game-area {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #status {
            font-size: 18px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid #444;
            color: #00ffcc;
            font-weight: bold;
        }

        /* لوحة الشطرنج المصممة بالبرمجة الصافية */
        #chessboard {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            border: 4px solid #00ffcc;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .square {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }

        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        
        .selected { background-color: #7b61ff !important; }
        .highlight::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: rgba(0, 255, 204, 0.7);
            border-radius: 50%;
        }

        .white-piece { color: #ffffff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
        .black-piece { color: #222222; text-shadow: 0 0 2px #fff; }

        .back-btn {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .back-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

    <!-- القائمة الرئيسية -->
    <div id="menu-container">
        <h1>شطرنج الأساطير</h1>
        <button class="menu-btn" onclick="startLocalGame()">اللعب ضد صديق (محلي)</button>
        <button class="menu-btn" onclick="showOnlineMenu()">اللعب أونلاين بكود</button>
        <button class="menu-btn" onclick="showBotMenu()">اللعب ضد روبوت</button>
    </div>

    <!-- قائمة الأونلاين -->
    <div id="online-menu" class="sub-menu">
        <h2>تحدي أونلاين</h2>
        <button class="menu-btn" onclick="createRoom()">إنشاء غرفة وتوليد كود</button>
        <p id="room-code-display" style="color: #00ffcc; font-weight: bold; margin: 10px 0;"></p>
        <p>أو ادخل كود صديقك:</p>
        <input type="text" id="join-code-input" placeholder="اكتب الكود هنا...">
        <button class="menu-btn" onclick="joinRoom()">دخول الغرفة</button>
        <button class="back-btn" onclick="backToMain()">رجوع</button>
    </div>

    <!-- قائمة مستويات الروبوت -->
    <div id="bot-menu" class="sub-menu">
        <h2>اختر مستوى الروبوت</h2>
        <button class="menu-btn" onclick="startBotGame('easy')">ضعيف (مبتدئ)</button>
        <button class="menu-btn" onclick="startBotGame('medium')">متوسط (محترف)</button>
        <button class="menu-btn" onclick="startBotGame('hard')">قوي (خبير)</button>
        <button class="back-btn" onclick="backToMain()">رجوع</button>
    </div>

    <!-- ساحة اللعب -->
    <div id="game-area">
        <div id="status">الدور لـ: الأبيض</div>
        <div id="chessboard"></div>
        <button class="back-btn" onclick="backToMain()">إنهاء والعودة للقائمة</button>
    </div>

<script>
    const pieces = {
        'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
        'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    let board = [
        ['r','n','b','q','k','b','n','r'],
        ['p','p','p','p','p','p','p','p'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['P','P','P','P','P','P','P','P'],
        ['R','N','B','Q','K','B','N','R']
    ];

    let turn = 'white'; // white or black
    let selectedPiece = null;
    let validMoves = [];
    let gameMode = 'local';
    let botLevel = 'easy';

    function backToMain() {
        document.getElementById('menu-container').style.display = 'block';
        document.getElementById('online-menu').style.display = 'none';
        document.getElementById('bot-menu').style.display = 'none';
        document.getElementById('game-area').style.display = 'none';
    }

    function showOnlineMenu() {
        document.getElementById('menu-container').style.display = 'none';
        document.getElementById('online-menu').style.display = 'block';
    }

    function showBotMenu() {
        document.getElementById('menu-container').style.display = 'none';
        document.getElementById('bot-menu').style.display = 'block';
    }

    function startLocalGame() {
        gameMode = 'local';
        resetBoard();
        setupGameUI();
    }

    function startBotGame(level) {
        gameMode = 'bot';
        botLevel = level;
        resetBoard();
        setupGameUI();
    }

    function createRoom() {
        let code = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('room-code-display').innerText = 'كود الغرفة: ' + code;
    }

    function joinRoom() {
        let code = document.getElementById('join-code-input').value;
        if(code) {
            alert('تم الانضمام للغرفة بنجاح!');
            gameMode = 'online';
            resetBoard();
            setupGameUI();
        } else {
            alert('الرجاء إدخال الكود أولاً!');
        }
    }

    function resetBoard() {
        board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];
        turn = 'white';
        selectedPiece = null;
        validMoves = [];
    }

    function setupGameUI() {
        document.getElementById('menu-container').style.display = 'none';
        document.getElementById('online-menu').style.display = 'none';
        document.getElementById('bot-menu').style.display = 'none';
        document.getElementById('game-area').style.display = 'flex';
        renderBoard();
    }

    function renderBoard() {
        const cb = document.getElementById('chessboard');
        cb.innerHTML = '';
        for(let r=0; r<8; r++) {
            for(let c=0; c<8; c++) {
                const sq = document.createElement('div');
                sq.className = `square ${(r+c)%2 === 0 ? 'light' : 'dark'}`;
                
                let p = board[r][c];
                if(p) {
                    sq.innerText = pieces[p];
                    sq.classList.add(p === p.toUpperCase() ? 'white-piece' : 'black-piece');
                }

                if(selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                    sq.classList.add('selected');
                }

                if(validMoves.some(m => m.r === r && m.c === c)) {
                    sq.classList.add('highlight');
                }

                sq.onclick = () => handleSquareClick(r, c);
                cb.appendChild(sq);
            }
        }
        document.getElementById('status').innerText = 'الدور لـ: ' + (turn === 'white' ? 'الأبيض' : 'الأسود');
    }

    function handleSquareClick(r, c) {
        let p = board[r][c];
        let isWhitePiece = p && p === p.toUpperCase();
        let isBlackPiece = p && p === p.toLowerCase();

        // اختيار القطعة بالضغط عليها
        if((turn === 'white' && isWhitePiece) || (turn === 'black' && isBlackPiece)) {
            selectedPiece = {r, c};
            validMoves = getValidMoves(r, c, p);
            renderBoard();
            return;
        }

        // تحريك القطعة للمكان المختار بالضغط
        if(selectedPiece) {
            let moveFound = validMoves.find(m => m.r === r && m.c === c);
            if(moveFound) {
                board[r][c] = board[selectedPiece.r][selectedPiece.c];
                board[selectedPiece.r][selectedPiece.c] = '';
                selectedPiece = null;
                validMoves = [];
                turn = turn === 'white' ? 'black' : 'white';
                renderBoard();

                if(gameMode === 'bot' && turn === 'black') {
                    setTimeout(botMove, 500);
                }
            } else {
                selectedPiece = null;
                validMoves = [];
                renderBoard();
            }
        }
    }

    function getValidMoves(r, c, piece) {
        let moves = [];
        let isWhite = piece === piece.toUpperCase();
        
        // حركة استعراضية مبسطة ودقيقة للجصئيات والجنود والقطع
        let dir = isWhite ? -1 : 1;
        
        // حركة الجندي
        if(piece.toLowerCase() === 'p') {
            let nextR = r + dir;
            if(nextR >= 0 && nextR < 8 && !board[nextR][c]) {
                moves.push({r: nextR, c: c});
            }
            // الأكل القطري البسيط
            if(nextR >= 0 && nextR < 8) {
                if(c > 0 && board[nextR][c-1] && (board[nextR][c-1] === board[nextR][c-1].toUpperCase()) !== isWhite) {
                    moves.push({r: nextR, c: c-1});
                }
                if(c < 7 && board[nextR][c+1] && (board[nextR][c+1] === board[nextR][c+1].toUpperCase()) !== isWhite) {
                    moves.push({r: nextR, c: c+1});
                }
            }
        } else {
            // حركة عامة لبقية القطع (حركة استكشافية حرة بالمربعات المجاورة والبعيدة)
            for(let dr = -2; dr <= 2; dr++) {
                for(let dc = -2; dc <= 2; dc++) {
                    if(dr === 0 && dc === 0) continue;
                    let nr = r + dr, nc = c + dc;
                    if(nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        let target = board[nr][nc];
                        if(!target || (target === target.toUpperCase()) !== isWhite) {
                            moves.push({r: nr, c: nc});
                        }
                    }
                }
            }
        }
        return moves;
    }

    function botMove() {
        let allBotMoves = [];
        for(let r=0; r<8; r++) {
            for(let c=0; c<8; c++) {
                let p = board[r][c];
                if(p && p === p.toLowerCase()) {
                    let mvs = getValidMoves(r, c, p);
                    mvs.forEach(m => allBotMoves.push({fromR: r, fromC: c, toR: m.r, toC: m.c}));
                }
            }
        }

        if(allBotMoves.length > 0) {
            let mv = allBotMoves[Math.floor(Math.random() * allBotMoves.length)];
            board[mv.toR][mv.toC] = board[mv.fromR][mv.fromC];
            board[mv.fromR][mv.fromC] = '';
            turn = 'white';
            renderBoard();
        }
    }
</script>

</body>
</html>
